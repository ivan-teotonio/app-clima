<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Consulte as condições atuais do clima de qualquer cidade."
    />
    <title>Clima</title>
  </head>
  <body>
    <div id="app">
      <section class="app-header">
        <form class="search-bar" id="search-form">
          <label class="sr-only" for="city-search">Cidade</label>
          <input
            class="search-bar__input"
            id="city-search"
            name="city"
            type="text"
            placeholder="Ex.: São Paulo"
            autocomplete="off"
          />
        </form>
      </section>

      <div class="loading hidden" id="loading">
        <p>Buscando o clima...</p>
      </div>

      <div class="empty-state" id="empty-state">
        <p class="empty-state__title">
          Não encontramos dados para esta cidade.
        </p>
        <p class="empty-state__hint">
          Verifique o nome digitado ou tente outra cidade.
        </p>
      </div>

      <div class="content hidden" id="content">
        <aside class="sidebar" id="sidebar">
          <p class="sidebar__temperature" id="sidebar-temperature">--</p>
          <h2 class="sidebar__city">
            <span id="sidebar-city-name">Cidade</span>
            <span class="sidebar__country" id="sidebar-country-code">BR</span>
          </h2>
          <p class="sidebar__day" id="sidebar-day">--</p>
          <p class="sidebar__is-day" id="sidebar-is-day">--</p>
          <p class="sidebar__weather-code" id="sidebar-weather-code">--</p>
        </aside>

        <main class="weather-info" id="weather-info">
          <div class="weather-info__item">
            <span class="weather-info__label">Umidade relativa</span>
            <span class="weather-info__value" id="weather-info-humidity">--</span>
          </div>
          <div class="weather-info__item">
            <span class="weather-info__label">Temperatura aparente</span>
            <span class="weather-info__value" id="weather-info-apparent-temperature">--</span>
          </div>
          <div class="weather-info__item">
            <span class="weather-info__label">Probabilidade de precipitação</span>
            <span class="weather-info__value" id="weather-info-precipitation-probability">--</span>
          </div>
          <div class="weather-info__item">
            <span class="weather-info__label">Vento</span>
            <span class="weather-info__value">
              <span id="weather-info-wind-speed">--</span>
              <span class="weather-info__direction" id="weather-info-wind-direction">--</span>
            </span>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
