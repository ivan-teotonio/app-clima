<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Consulte as condições atuais do clima de qualquer cidade."
    />
    <title>Clima</title>
  </head>
  <body>
    <div id="app">
      <section class="app-header">
        <form class="search-bar" id="search-form">
          <label class="sr-only" for="city-search">Cidade</label>
          <input
            class="search-bar__input"
            id="city-search"
            name="city"
            type="text"
            placeholder="Ex.: São Paulo"
            autocomplete="off"
          />
        </form>
      </section>
      <div class="loading hidden" id="loading">
        <p>Buscando o clima...</p>
      </div>
      <div class="empty-state" id="empty-state">
        <p>Não encontramos dados para esta cidade.</p>
        <p>Verifique o nome digitado ou tente outra cidade.</p>
      </div>
      <div class="content hidden" id="content">
        <aside class="sidebar" id="sidebar">
          <p id="sidebar-temperature">--</p>
          <h2 id="sidebar-city-name">Cidade</h2>
          <span id="sidebar-country-code">BR</span>
          <p id="sidebar-day">--</p>
          <p id="sidebar-is-day">--</p>
          <p id="sidebar-weather-code">--</p>
        </aside>
        <main class="weather-info" id="weather-info">
          <p id="weather-info-humidity">--</p>
          <p id="weather-info-apparent-temperature">--</p>
          <p id="weather-info-precipitation-probability">--</p>
          <p id="weather-info-wind-speed">--</p>
          <p id="weather-info-wind-direction">--</p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
