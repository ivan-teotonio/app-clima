name: Deploy — GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões mínimas necessárias para publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez, sem cancelar um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Tenta criar o site do Pages automaticamente no primeiro deploy.
          enablement: true

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
