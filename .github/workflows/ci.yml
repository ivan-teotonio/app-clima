name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancela execuções antigas do mesmo branch/PR quando um novo commit chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build

      - name: Guardar build como artefato
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
